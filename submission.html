<div class="action-group" id="studentform">
                <h4>Student Registration Details</h4>
    <form>
        <label>Full Name</label>
        <input type="text" placeholder="e.g. Ebube Uche" required>
        <label>Student ID</label>
        <input type="number">
        <label>Email Address</label>
        <input type="email" placeholder="e.g. ebubeuche@school.com" required>
        <label>Gender</label>
        <select id="Gender" name="Gender"required>
        <option value="">select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        </select>
        <label>Class / Grade</label>
        <input type="number">
      <button type="button" id="addBtn">Submit Records</button>
    </form>
</div>
