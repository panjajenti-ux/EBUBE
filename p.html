<div id="create-form" class="sub-panel hidden">
    <h4>Add New Student Details</h4>
    <form onsubmit="event.preventDefault();">
      <div class="input-field">
        <label>Full Name</label>
        <input type="text" placeholder="e.g. John Doe" required>
      </div>
      <div class="input-field">
        <label>Student ID</label>
        <input type="text" placeholder="e.g. SEC-2026-042" required>
      </div>
      <div class="input-field">
        <label>Email Address</label>
        <input type="email" placeholder="e.g. john@school.com" required>
      </div>
      <div class="input-field">
        <label>Class / Grade</label>
        <input type="text" placeholder="e.g. Form 4B" required>
      </div>
      <button type="submit" class="submit-btn">Submit Record</button>
    </form>
  </div>
</div>
<div id="view-actions" class="sub-panel hidden">
    <h4>Manage Existing Records</h4>
    <div class="view-button-grid">
      <button class="view-sub-btn btn-read">📖 Read (View List)</button>
      <button class="view-sub-btn btn-update">✏️ Update Details</button>
      <button class="view-sub-btn btn-delete">🗑️ Delete Record</button>
    </div>
  </div>
</div>
